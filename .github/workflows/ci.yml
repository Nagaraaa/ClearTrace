name: Build and foundation tests

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet build ClearTrace/ClearTrace.csproj --configuration Release
      - run: dotnet run --project ClearTrace.FoundationTests/ClearTrace.FoundationTests.csproj --configuration Release
      - run: dotnet run --project ClearTrace.WorkflowTests/ClearTrace.WorkflowTests.csproj --configuration Release
